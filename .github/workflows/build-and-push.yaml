name: Build and Push Ktor API

# This tells GitHub to run this workflow every time you push to the 'main' branch
on:
  push:
    branches:
      - main

# Define environment variables used in the workflow
env:
  REGISTRY: ghcr.io
  # github.repository is automatically formatted as "Organization-Name/repo-name"
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # We need to grant GitHub Actions permission to write to the Packages registry
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Download your code onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (allows for advanced caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry using the automatic GITHUB_TOKEN
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Automatically extract lowercase tags and labels for the image
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 5. Build the image and push it to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # This tells it to build the image, but push it to the registry
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # This utilizes GitHub Actions cache to speed up your 3-stage Gradle build!
          cache-from: type=gha
          cache-to: type=gha,mode=max
