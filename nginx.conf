server {
    listen 80;
    server_name _; # Listens to any incoming IP or domain name for now

    location / {
        # Forward traffic to the Ktor container on its internal port 8080
        proxy_pass http://ktor-api:8080;

        # Standard headers to pass real client IP and info back to Ktor
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
