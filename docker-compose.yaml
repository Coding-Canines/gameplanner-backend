services:
  postgres-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Optional: keeps DB accessible on your server's localhost for debugging
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Ensures Postgres is actually ready to accept connections
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  ktor-api:
    build: .
    restart: always
    environment:
      DB_URL: r2dbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-db:
        # Ktor will only start AFTER the Postgres healthcheck passes
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      # Map the host's public port 80 to Nginx's internal port 80
      - "80:80"
    volumes:
      # Inject your custom config file into Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ktor-api

volumes:
  postgres-data:
